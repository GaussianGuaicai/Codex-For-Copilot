name: Pull Request Title

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Conventional Commit title
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout pull request head
        if: ${{ github.event.pull_request.commits == 1 }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Check pull request and squash title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          pattern='^(feat|fix|perf|revert|docs|refactor|test|build|ci|chore)(\([a-z0-9][a-z0-9._/-]*\))?!?:[[:space:]].+'

          check_title() {
            local label="$1"
            local title="$2"
            if [[ "$title" =~ $pattern ]]; then
              return 0
            fi
            echo "::error::${label} must follow Conventional Commits: ${title}"
            return 1
          }

          check_title "Pull request title" "$PR_TITLE"

          # This repository uses squash_merge_commit_title=COMMIT_OR_PR_TITLE.
          # For a single-commit PR GitHub uses the commit subject, so validate it too.
          if [[ "$PR_COMMITS" == "1" ]]; then
            HEAD_TITLE="$(git log -1 --format=%s)"
            check_title "Single-commit squash title" "$HEAD_TITLE"
          fi
